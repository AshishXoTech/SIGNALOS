services:
  db:
    image: postgis/postgis:15-3.4
    platform: linux/amd64
    container_name: disaster_db
    restart: always
    environment:
      POSTGRES_DB: disaster_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/init_db.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d disaster_ai"]
      interval: 3s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: disaster_backend
    restart: always
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/disaster_ai
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: >
      sh -c "
        echo '🚀 Starting FastAPI Server...' &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

volumes:
  pgdata: